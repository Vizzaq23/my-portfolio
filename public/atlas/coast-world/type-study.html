<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Three coastal title directions</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="titles.css"><style>main{max-width:1800px}header{align-items:flex-start}.intro h1{font-size:28px;font-weight:500;margin:8px 0}.intro p{font-size:13px;color:#9bb1bf}.studies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin:28px 0}.card{min-width:0}.card h2{font-size:17px;font-weight:500;margin:0 0 12px}.card p{font-size:12px;color:#9cafbc;margin:15px 0}.card .stage{aspect-ratio:1672/941}.scene-image{width:100%;height:100%;display:block}.card>a{display:inline-block;font-size:12px;border-bottom:1px solid #ab9667;padding-bottom:4px}.note{font-size:12px;color:#819bab;border-top:1px solid #273c50;padding-top:15px}#render-source{position:fixed;left:-2000px;width:1000px;height:700px;visibility:hidden;pointer-events:none}@media(max-width:1100px){.studies{grid-template-columns:1fr;max-width:950px;margin:25px auto}.card{margin-bottom:22px}}@media(min-width:1101px){.card .title[data-typography] p{font-size:.8cqw}.card .title[data-typography] .skip{font-size:.72cqw}.card .title[data-typography] .start{font-size:1.7cqw}}</style></head><body><main><header><div class="intro"><small>TYPOGRAPHY / THREE DIRECTIONS</small><h1>Same coast. Different identity.</h1><p>One identical, paused night scene. Only the lettering, hierarchy and menu styling change.</p></div><a href="index.html">Back to live coast ↗</a></header><div class="studies" id="studies"></div><p class="note" id="study-status">Rendering the shared coastal backdrop…</p></main><script type="module" src="type-study.js"></script></body></html>
