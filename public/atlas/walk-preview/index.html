<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRT room · motion study</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080c12;color:#f1e5c8;font:14px ui-monospace,monospace}canvas{display:block;width:100%;height:100%;image-rendering:pixelated}#view{position:fixed;inset:0}header,footer{position:fixed;left:0;right:0;padding:22px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:linear-gradient(#080c12cc,transparent)}footer{bottom:0;align-items:end;background:linear-gradient(transparent,#080c12ee)}header{top:0}small{display:block;color:#a5acb4;font-size:11px;margin-top:7px}select{font:inherit;color:#f1e5c8;background:#131c26;padding:8px;border:1px solid #6a7280}button,a{font:inherit;color:inherit;background:#131c26d9;border:1px solid #6a7280;padding:11px 15px;border-radius:3px;cursor:pointer;text-decoration:none}button:hover,a:hover{background:#273546}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffd37a;outline-offset:4px}button:disabled{opacity:.5;cursor:default}nav{display:flex;gap:8px;align-items:center}#action{background:#e6c379;color:#131c26;font-weight:bold}#prompt{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);text-align:center;width:min(90%,500px)}#phase{font-size:18px;margin-bottom:12px}#progress{height:3px;position:fixed;bottom:0;left:0;background:#efc477;width:0}label{font-size:12px}#end{display:none} @media(max-width:650px){header,footer{padding:14px}nav{flex-wrap:wrap;justify-content:end}header>div{max-width:120px}small{max-width:200px}footer{font-size:11px}button,a{padding:10px}#prompt{bottom:125px}}

#game{position:fixed;inset:0;background:#101b28;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:65px 16px 16px}#game[hidden]{display:none}#game-frame{width:min(100%,850px);min-height:0;aspect-ratio:512/360}#game-frame canvas{object-fit:contain;outline-offset:2px}.game-bar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0 0}#world-status{color:#f2d48f}#game-help{font-size:12px;text-align:center;color:#bdcbd3}.touch-controls{display:flex;gap:14px}.touch-controls button{min-width:65px;touch-action:none;user-select:none}.playing header{z-index:6;padding:12px}.playing header>div,.playing #skip,.playing footer,.playing #prompt,.playing #progress{display:none}.playing header{justify-content:end;background:none}.project-dialog{color:#f2e8d3;background:#162637;border:1px solid #c3a26c;border-radius:8px;width:min(720px,94vw);max-height:85dvh;padding:25px;line-height:1.65}.project-dialog::backdrop{background:#030b15d9}.project-dialog img{display:block;max-width:100%;max-height:280px;object-fit:contain;margin:20px auto}.project-dialog a,.project-dialog button{display:inline-block;margin:7px}.project-dialog h1{font-size:25px}.project-dialog li{margin-bottom:8px}@media(max-width:650px){#game{padding-top:60px}.game-bar{font-size:12px}.game-bar button{padding:8px}#game-help{max-width:330px}}
</style></head><body><div id="view"></div><header><div>QUINTIN / ROOM STUDY<small id="asset-status">Loading authored assets…</small></div><nav><button id="sound" aria-pressed="false">Sound off</button><button id="skip">Skip intro</button><a href="/">View portfolio</a></nav></header><div id="prompt"><div id="phase" role="status" aria-live="polite">Loading room…</div><button id="action" disabled>Approach TV</button><div id="end"><a href="/atlas">Explore existing atlas</a></div></div><footer><div><span id="time">0.0 / 11.8 seconds</span><small>11.8s motion study · hand refinement pending</small></div><nav><label><input id="motion" type="checkbox"> Reduced motion</label><label>Study <select id="study" aria-label="Study view"><option value="walk">Walk sequence</option><option value="corner">TV and Chopper</option><option value="grip">Hand grip</option></select></label><button id="lighting" aria-pressed="false">Preview TV glow</button><button id="replay">Replay</button></nav></footer><div id="progress"></div><script type="module" src="./preview.js"></script></body></html>
